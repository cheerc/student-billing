name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-and-build:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: web
        run: npm run typecheck

      - name: ESLint Check
        working-directory: web
        run: npm run lint

      - name: Vitest Integration & Unit Tests
        working-directory: web
        run: npm run test

      - name: Next.js Production Build
        working-directory: web
        run: npm run build

      - name: Install Chromium for isolated performance measurement
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Isolated production API performance (477 students, no retries)
        working-directory: web
        run: npm run test:perf:isolated

      - name: Isolated roster changes performance (477 students, no retries)
        working-directory: web
        run: npm run test:perf:roster-isolated
